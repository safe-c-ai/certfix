services:
  llama-server:
    image: "${LLAMA_SERVER_IMAGE:?Set LLAMA_SERVER_IMAGE to an MTP-capable llama-server image}"
    entrypoint: ["/bin/sh", "-lc"]
    command: >
      if [ -n "$${LLAMA_MODEL_PATH:-}" ]; then
        set -- -m "$${LLAMA_MODEL_PATH}";
      else
        set -- -hf "$${LLAMA_GGUF_REPO:-$${QWEN36_GGUF_REPO:-unsloth/Qwen3.6-27B-MTP-GGUF:UD-Q4_K_XL}}";
      fi;
      exec llama-server
      "$$@"
      -ngl "$${LLAMA_N_GPU_LAYERS:-99}"
      -c "$${LLAMA_CONTEXT_SIZE:-8192}"
      -fa "$${LLAMA_FLASH_ATTN:-on}"
      -np "$${LLAMA_PARALLEL:-1}"
      --host "$${LLAMA_HOST:-0.0.0.0}"
      --port "$${LLAMA_PORT:-8952}"
      --cache-ram "$${LLAMA_CACHE_RAM:-0}"
      --spec-type "$${LLAMA_SPEC_TYPE:-draft-mtp}"
      --spec-draft-n-max "$${LLAMA_SPEC_DRAFT_N_MAX:-2}"
      --reasoning-budget "$${LLAMA_REASONING_BUDGET:-1024}"
    environment:
      LLAMA_GGUF_REPO: "${LLAMA_GGUF_REPO:-}"
      QWEN36_GGUF_REPO: "${QWEN36_GGUF_REPO:-}"
      LLAMA_MODEL_PATH: "${LLAMA_MODEL_PATH:-}"
      LLAMA_N_GPU_LAYERS: "${LLAMA_N_GPU_LAYERS:-99}"
      LLAMA_CONTEXT_SIZE: "${LLAMA_CONTEXT_SIZE:-8192}"
      LLAMA_FLASH_ATTN: "${LLAMA_FLASH_ATTN:-on}"
      LLAMA_PARALLEL: "${LLAMA_PARALLEL:-1}"
      LLAMA_CACHE_RAM: "${LLAMA_CACHE_RAM:-0}"
      LLAMA_SPEC_TYPE: "${LLAMA_SPEC_TYPE:-draft-mtp}"
      LLAMA_SPEC_DRAFT_N_MAX: "${LLAMA_SPEC_DRAFT_N_MAX:-2}"
      LLAMA_REASONING_BUDGET: "${LLAMA_REASONING_BUDGET:-1024}"
    ports:
      - "${LLAMA_SERVER_PORT:-8952}:8952"
    volumes:
      - "${HOST_MODEL_DIR:-${QWEN36_MODEL_DIR:-./models}}:/models:ro"
      - "${HOST_MODEL_CACHE_DIR:-${QWEN36_CACHE_DIR:-llama-model-cache}}:/root/.cache"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  certfix:
    image: "${CERTFIX_IMAGE:-ghcr.io/safe-c-ai/certfix:edge}"
    working_dir: /input
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    volumes:
      - "${SOURCE_DIR:-.}:/input:ro"
      - "${OUTPUT_DIR:-./certfix-output}:/output"
    depends_on:
      - llama-server
    command: ["certfix-docker", "local-check"]

volumes:
  llama-model-cache:
