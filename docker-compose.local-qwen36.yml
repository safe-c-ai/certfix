services:
  llama-server:
    image: "${LLAMA_SERVER_IMAGE:?Set LLAMA_SERVER_IMAGE to an MTP-capable llama-server image}"
    entrypoint: ["llama-server"]
    command:
      - -hf
      - "${QWEN36_GGUF_REPO:-unsloth/Qwen3.6-27B-MTP-GGUF:UD-Q4_K_XL}"
      - -ngl
      - "${LLAMA_N_GPU_LAYERS:-99}"
      - -c
      - "${LLAMA_CONTEXT_SIZE:-8192}"
      - -fa
      - "on"
      - -np
      - "1"
      - --host
      - 0.0.0.0
      - --port
      - "8952"
      - --cache-ram
      - "0"
      - --spec-type
      - draft-mtp
      - --spec-draft-n-max
      - "${LLAMA_SPEC_DRAFT_N_MAX:-2}"
      - --reasoning-budget
      - "${LLAMA_REASONING_BUDGET:-1024}"
    ports:
      - "${LLAMA_SERVER_PORT:-8952}:8952"
    volumes:
      - qwen36-model-cache:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  certfix:
    image: "${CERTFIX_IMAGE:-ghcr.io/safe-c-ai/certfix:edge}"
    working_dir: /workspace
    volumes:
      - .:/workspace
    depends_on:
      - llama-server
    entrypoint: ["certfix"]

volumes:
  qwen36-model-cache:
