# Gemini 3 Flash Preview via OpenRouter.
#
# This profile is intended for comparative evaluation against the local
# Qwen3.6 MTP release-default path. It reuses the current CERT-C prompt flow and
# sends requests through OpenAI-compatible `/v1/chat/completions`.
#
# Required environment:
#
#   export OPENROUTER_API_KEY=...
#
# No provider is pinned; OpenRouter chooses an available provider.

detection:
  backend: api
  prompt_profile: qwen36_certfix_check_v1
  batch_size: 1
  qwen36_rule_id_strategy: sequential_top2_p3
  qwen36_selector_candidate_k: 2
  qwen36_selector_permutations: 3
  api:
    base_url: https://openrouter.ai/api/v1
    model: google/gemini-3-flash-preview
    api_key_env: OPENROUTER_API_KEY
    timeout: 300
    max_tokens: 1024
    temperature: 0.0
    retry_attempts: 8
    retry_initial_delay: 5.0
    retry_max_delay: 90.0
    extra_body: {}

models:
  gemini_3_flash_preview:
    backend: api
    profile: gemini_3_flash_preview
    max_tokens: 4096
    temperature: 0.0
    api:
      base_url: https://openrouter.ai/api/v1
      model: google/gemini-3-flash-preview
      api_key_env: OPENROUTER_API_KEY
      timeout: 300
      max_tokens: 4096
      temperature: 0.0
      retry_attempts: 8
      retry_initial_delay: 5.0
      retry_max_delay: 90.0
      extra_body: {}

validation:
  compile:
    enabled: true
    command: gcc
    args: ["-fsyntax-only"]
    include_paths: []
    timeout: 30
  violation_removal:
    enabled: true
    detector_role: gemini_3_flash_preview
    method: non_target_advisory
    max_tokens: 512
    override_denylist: ["SIG34-C", "STR31-C"]
  semantic:
    enabled: true
    reviewer_role: gemini_3_flash_preview
    block_on_uncertain: true

fix:
  simple_repairer_role: gemini_3_flash_preview
  simple_repair_profile: qwen36_27b_complete_repair_rule_guided_v1
  simple_max_tokens: 4096
  validate_guided_retry: true
  retry_max_attempts: 1
  retry_max_tokens: 4096
  retry_rule_addenda_v1: true
  retry_rule_addenda_rule_ids: ["ARR37-C", "CON31-C", "POS48-C", "SIG30-C", "ENV33-C"]
