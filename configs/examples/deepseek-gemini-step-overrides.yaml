# Step-specific API override example.
#
# This is an advanced profile for users who want a low-cost detector but a
# stronger model on the steps where certfix quality is most sensitive.
#
# Required environment:
#
#   export OPENROUTER_API_KEY=...
#
# Routing:
# - Initial violation detection: DeepSeek V4 Flash via DeepInfra
# - Rule ID candidate generation: DeepSeek V4 Flash via DeepInfra
# - Rule ID selector voting: Gemini 3 Flash Preview
# - Primary fix generation: Gemini 3 Flash Preview
# - Retry generation: Gemini 3 Flash Preview
# - Semantic and violation-audit checks: Gemini 3 Flash Preview

# Initial detection still uses the normal detection block. For Qwen3.6-style
# prompt detection, candidate generation stays on the detection backend by
# default. pipeline.overrides.rule_selector_voting reroutes only the selector
# voting prompts after initial detection finds a violation.
detection:
  backend: api
  prompt_profile: qwen36_certfix_check_v1
  batch_size: 1
  qwen36_rule_id_strategy: sequential_top2_p3
  qwen36_selector_candidate_k: 2
  qwen36_selector_permutations: 3
  api:
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v4-flash
    api_key_env: OPENROUTER_API_KEY
    timeout: 300
    max_tokens: 1024
    temperature: 0.0
    retry_attempts: 8
    retry_initial_delay: 5.0
    retry_max_delay: 90.0
    extra_body:
      provider:
        order: ["DeepInfra"]
        allow_fallbacks: false

models:
  gemini_3_flash_preview:
    backend: api
    profile: gemini_3_flash_preview
    max_tokens: 4096
    temperature: 0.0
    api:
      base_url: https://openrouter.ai/api/v1
      model: google/gemini-3-flash-preview
      api_key_env: OPENROUTER_API_KEY
      timeout: 300
      max_tokens: 4096
      temperature: 0.0
      retry_attempts: 8
      retry_initial_delay: 5.0
      retry_max_delay: 90.0
      extra_body: {}

pipeline:
  overrides:
    rule_selector_voting: gemini_3_flash_preview
    fix_generation: gemini_3_flash_preview
    post_fix_detection: gemini_3_flash_preview
    retry_generation: gemini_3_flash_preview
    semantic_check: gemini_3_flash_preview
    violation_audit: gemini_3_flash_preview

validation:
  compile:
    enabled: true
    command: gcc
    args: ["-fsyntax-only"]
    include_paths: []
    timeout: 30
  violation_removal:
    enabled: true
    detector_role: gemini_3_flash_preview
    method: non_target_advisory
    max_tokens: 512
    override_denylist: ["SIG34-C", "STR31-C"]
  semantic:
    enabled: true
    reviewer_role: gemini_3_flash_preview
    block_on_uncertain: true

fix:
  simple_repairer_role: gemini_3_flash_preview
  simple_repair_profile: qwen36_27b_complete_repair_rule_guided_v1
  simple_max_tokens: 4096
  validate_guided_retry: true
  retry_max_attempts: 1
  retry_max_tokens: 4096
  retry_rule_addenda_v1: true
  retry_rule_addenda_rule_ids: ["ARR37-C", "CON31-C", "POS48-C", "SIG30-C", "ENV33-C"]
