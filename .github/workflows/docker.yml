name: Docker

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Container tag to publish for manual runs"
        required: false
        default: edge

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish GHCR image
    if: github.repository == 'safe-c-ai/certfix'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            {
              echo "tags<<EOF"
              echo "${image}:${version}"
              echo "${image}:${GITHUB_REF_NAME}"
              echo "${image}:latest"
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
            tag="${tag:-edge}"
            echo "tags=${image}:${tag}" >> "${GITHUB_OUTPUT}"
          else
            echo "tags=${image}:edge" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=certfix API-only CLI image
            org.opencontainers.image.licenses=MIT

      - name: Smoke test published image
        run: |
          first_tag="$(printf '%s\n' "${{ steps.image.outputs.tags }}" | head -n 1)"
          docker run --rm "${first_tag}" --help
          docker run --rm "${first_tag}" config --list
