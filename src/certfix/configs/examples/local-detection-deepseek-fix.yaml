# Local Qwen3.6 detection with DeepSeek V4 Flash repair/validation.
#
# Use this profile when local Qwen3.6 MTP is available and DeepSeek V4 Flash is
# used only for the repair side of the pipeline.
#
# Required runtime:
#
#   llama-server -m /path/to/qwen3.6-27b-mtp-ud-q4_k_xl.gguf \
#     -ngl 99 -c 8192 -fa on -np 1 \
#     --host 127.0.0.1 --port 8952 \
#     --cache-ram 0 \
#     --spec-type draft-mtp --spec-draft-n-max 2
#
# Required environment:
#
#   export OPENROUTER_API_KEY=...

detection:
  backend: local_llama_server
  prompt_profile: qwen36_certfix_check_v1
  batch_size: 1
  qwen36_rule_id_strategy: sequential_top2_p3
  qwen36_selector_candidate_k: 2
  qwen36_selector_permutations: 3
  api:
    base_url: http://127.0.0.1:8952/v1
    model: unsloth/Qwen3.6-27B-MTP-GGUF:UD-Q4_K_XL
    api_key_env: ""
    timeout: 300
    max_tokens: 1024
    temperature: 0.0

models:
  deepseek_v4_flash:
    backend: api
    profile: deepseek_v4_flash
    max_tokens: 4096
    temperature: 0.0
    api:
      base_url: https://openrouter.ai/api/v1
      model: deepseek/deepseek-v4-flash
      api_key_env: OPENROUTER_API_KEY
      timeout: 300
      max_tokens: 4096
      temperature: 0.0
      retry_attempts: 8
      retry_initial_delay: 5.0
      retry_max_delay: 90.0
      extra_body:
        provider:
          order: ["DeepInfra"]
          allow_fallbacks: false

fix:
  simple_repairer_role: deepseek_v4_flash
  simple_repair_profile: qwen36_27b_complete_repair_rule_guided_v1
  simple_max_tokens: 4096
  validate_guided_retry: true
  retry_max_attempts: 1
  retry_max_tokens: 4096
  retry_rule_addenda_v1: true
  retry_rule_addenda_rule_ids: ["ARR37-C", "CON31-C", "POS48-C", "SIG30-C", "ENV33-C"]

validation:
  compile:
    enabled: true
    command: gcc
    args: ["-fsyntax-only"]
    include_paths: []
    timeout: 30
  violation_removal:
    enabled: true
    detector_role: deepseek_v4_flash
    method: non_target_advisory
    max_tokens: 512
    override_denylist: ["SIG34-C", "STR31-C"]
  semantic:
    enabled: true
    reviewer_role: deepseek_v4_flash
    block_on_uncertain: true
