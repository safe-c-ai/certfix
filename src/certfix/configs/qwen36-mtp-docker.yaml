# Docker Compose local Qwen3.6 profile for check and fix.
#
# Use this profile when certfix runs in Docker Compose and talks to a sibling
# `llama-server` service on the Compose network. Outside Compose, use
# `qwen36-mtp-local` instead.
#
# The `llama-server` service must be MTP-capable and listen on:
#
#   http://llama-server:8952/v1
#
# Non-MTP llama-server execution is not the verified local profile; use it only
# intentionally after testing your runtime.

detection:
  backend: local_llama_server
  prompt_profile: qwen36_certfix_check_v1
  batch_size: 1
  qwen36_rule_id_strategy: sequential_top2_p3
  qwen36_selector_candidate_k: 2
  qwen36_selector_permutations: 3
  api:
    base_url: http://llama-server:8952/v1
    model: unsloth/Qwen3.6-27B-MTP-GGUF:UD-Q4_K_XL
    api_key_env: ""
    timeout: 300
    max_tokens: 1024
    temperature: 0.0

models:
  qwen36_local:
    backend: local_llama_server
    profile: qwen36_27b_local
    max_tokens: 4096
    temperature: 0.0
    api:
      base_url: http://llama-server:8952/v1
      model: unsloth/Qwen3.6-27B-MTP-GGUF:UD-Q4_K_XL
      api_key_env: ""
      timeout: 300
      max_tokens: 4096
      temperature: 0.0

validation:
  compile:
    enabled: true
    command: gcc
    args: ["-fsyntax-only"]
    include_paths: []
    timeout: 30
  violation_removal:
    enabled: true
    detector_role: qwen36_local
    method: non_target_advisory
    max_tokens: 512
    override_denylist: ["SIG34-C", "STR31-C"]
  semantic:
    enabled: true
    reviewer_role: qwen36_local
    block_on_uncertain: true

fix:
  simple_repairer_role: qwen36_local
  simple_repair_profile: qwen36_27b_complete_repair_rule_guided_v1
  simple_max_tokens: 4096
  validate_guided_retry: true
  retry_max_attempts: 1
  retry_max_tokens: 4096
  retry_rule_addenda_v1: true
  retry_rule_addenda_rule_ids: ["ARR37-C", "CON31-C", "POS48-C", "SIG30-C", "ENV33-C"]

check:
  exclude: []
