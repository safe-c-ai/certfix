services:
  certfix:
    image: "${CERTFIX_IMAGE:-ghcr.io/safe-c-ai/certfix:0.3.1}"
    working_dir: /input
    volumes:
      - "${SOURCE_DIR:-.}:/input:ro"
      - "${OUTPUT_DIR:-./certfix-output}:/output"
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    command: ["certfix-docker", "api-check"]
